<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Central Church Warrington</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="shell">
            <header>
                <div class="brand">
                    <div>
                        <strong>Central Church Warrington</strong>
                        <span>Welcome • Connect • Serve</span>
                    </div>
                </div>
                <div class="clock" id="clock"></div>
            </header>
            
            <main>
                <section class="hero">
                    <div class="eyebrow">Welcome to Central Church Warrington</div>
                    <h1>How can we help today?</h1>
                    <p>Take a moment to connect, get involved, or support the work of the church.</p>
                    <div class="grid">
                        <button class="tile" data-form="connect"><div class="icon">͍</div><h2>Stay Connected</h2><p>Join our email list for church news, events and updates.</p></button>
                        <button class="tile" data-form="give"><div class="icon">♥︎</div><h2>Give</h2><p>Make a one-time gift or set up regular giving securely.</p></button>
                        <button class="tile" data-form="serve"><div class="icon">🙋</div><h2>Serve with Us</h2><p>Tell us where you'd love to volunteer on a Sunday.</p></button>
                        <button class="tile" data-form="new"><div class="icon">👋</div><h2>I'm New</h2><p>We'd love to say hello and help you get connected.</p></button>
                        <button class="tile" data-form="events"><div class="icon">📅</div><h2>What's On?</h2><p>See upcoming services, groups and events.</p></button>
                    </div>
                </section>
            </main>
            <footer>Central Church Warrington</footer>
        </div>
    </div>
    <div class="overlay" id="overlay">
        <div class="modal" id="modal"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
